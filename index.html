<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rishi's App Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF4FB;
    --grid: #D3E2F2;
    --ink: #1C2847;
    --ink-soft: #4A5878;
    --card: #FFFFFF;
    --highlight: #FFE45C;
    --key: #F7F9FC;
    --key-edge: #B9C7DB;
    --accent: #2A9D8F;
    --focus: #3B6FE0;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #141B2D;
      --grid: #1F2940;
      --ink: #E9EEF7;
      --ink-soft: #A3B0C8;
      --card: #1B2438;
      --highlight: #C9A800;
      --key: #26314A;
      --key-edge: #10172A;
      --accent: #4CC3B4;
      --focus: #8AB0FF;
    }
  }
  :root[data-theme="dark"] {
    --paper: #141B2D;
    --grid: #1F2940;
    --ink: #E9EEF7;
    --ink-soft: #A3B0C8;
    --card: #1B2438;
    --highlight: #C9A800;
    --key: #26314A;
    --key-edge: #10172A;
    --accent: #4CC3B4;
    --focus: #8AB0FF;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 28px 28px;
    font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
    font-size: 1.0625rem;
    line-height: 1.55;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: clamp(2rem, 6vw, 4.5rem) clamp(1.25rem, 4vw, 2.5rem) 4rem;
  }

  header { margin-bottom: clamp(2.25rem, 6vw, 3.5rem); }
  h1 {
    font-family: "Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.75rem, 9vw, 5.5rem);
    line-height: 0.95;
    letter-spacing: -0.03em;
    margin: 0 0 1rem;
  }
  h1 .hl {
    background: linear-gradient(transparent 58%, var(--highlight) 58%, var(--highlight) 92%, transparent 92%);
    padding: 0 0.08em;
  }
  .intro {
    margin: 0;
    max-width: 34ch;
    color: var(--ink-soft);
    font-size: 1.15rem;
  }

  .shelf {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr));
    gap: 1.5rem;
  }

  .app {
    display: flex;
    flex-direction: column;
    background: var(--card);
    color: inherit;
    text-decoration: none;
    border: 2px solid var(--ink);
    border-radius: 14px;
    box-shadow: 5px 5px 0 var(--ink);
    padding: 1.25rem 1.25rem 1.1rem;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .app:hover { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
  .app:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
  .app:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }

  .keys {
    display: flex;
    gap: 6px;
    margin-bottom: 1.1rem;
  }
  .keys span {
    flex: 1;
    max-width: 52px;
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.35rem;
    background: var(--key);
    border: 1.5px solid var(--key-edge);
    border-bottom-width: 5px;
    border-radius: 8px;
  }
  .app:hover .keys span:nth-child(odd) { transform: translateY(2px); border-bottom-width: 3px; }

  .app h3 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: 1.5rem;
    line-height: 1.15;
    margin: 0 0 0.4rem;
  }
  .app p { margin: 0 0 1rem; color: var(--ink-soft); }
  .play {
    margin-top: auto;
    align-self: flex-start;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    padding: 0.45rem 1rem;
    border-radius: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .play { color: #0F1626; }
  }
  :root[data-theme="dark"] .play { color: #0F1626; }

  .slot {
    display: grid;
    place-items: center;
    text-align: center;
    min-height: 220px;
    border: 2px dashed var(--key-edge);
    border-radius: 14px;
    color: var(--ink-soft);
    padding: 1.25rem;
  }
  .slot strong {
    display: block;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 1.2rem;
    color: var(--ink);
    margin-bottom: 0.2rem;
  }

  .tabs {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    padding: 0.85rem 0;
    margin-bottom: 1.75rem;
    background: var(--paper);
    border-bottom: 2px solid var(--ink);
  }
  .tab {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.4rem 0.95rem 0.4rem 1.05rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    min-height: 44px;
  }
  .tab .count {
    font-size: 0.85rem;
    min-width: 1.6em;
    padding: 0.05rem 0.4rem;
    border-radius: 999px;
    background: var(--key);
    border: 1.5px solid var(--key-edge);
    text-align: center;
  }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .tab[aria-pressed="true"] .count { background: var(--highlight); color: #1C2847; border-color: transparent; }
  .tab:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .group + .group { margin-top: clamp(2.5rem, 6vw, 3.5rem); }
  .group[hidden] { display: none; }
  .group-head {
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    margin: 0 0 1.1rem;
  }
  .group-head h2 {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(1.6rem, 4.5vw, 2.1rem);
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin: 0;
  }
  .group-head p { margin: 0; color: var(--ink-soft); }
  @media (max-width: 520px) {
    .group-head { flex-direction: column; gap: 0.15rem; }
  }

  footer {
    margin-top: 3rem;
    font-size: 0.95rem;
    color: var(--ink-soft);
    max-width: 60ch;
  }

  @media (prefers-reduced-motion: reduce) {
    .app, .keys span { transition: none; }
    .app:hover, .app:active { transform: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Rishi's<br><span class="hl">App Hub</span></h1>
    <p class="intro">Games and tools I've made. Pick one and have a go.</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections"></nav>

  <div id="groups"></div>

  <footer>
    Apps open in a new tab. If one takes a little while to appear, give it up to a minute — it's waking up.
  </footer>
</main>

<script>
  // Sections appear in this order. Add a new section here if you need one.
  const sections = [
    { id: "games", name: "Games", blurb: "Beat your best score." },
    { id: "tools", name: "Tools", blurb: "Handy things for getting stuff done." }
  ];

  // Add a new app by adding an entry to this list.
  // "section" must match one of the section ids above.
  // Apps are sorted A to Z inside each section automatically.
  const apps = [
    {
      name: "Speed Typing Challenge",
      section: "games",
      keys: ["T", "Y", "P", "E"],
      description: "Race the clock across four levels, from Easy to Extreme. Get coaching on tricky keys and get your name on the leaderboard.",
      url: "https://speed-typing-challenge.onrender.com/"
    },
    {
      name: "Keylight",
      section: "games",
      keys: ["K", "E", "Y", "✦"],
      description: "Tap the falling tiles in time with the music, or switch to Real Piano and play along on an actual piano. Pick a song, set the speed and chase the leaderboard.",
      url: "https://keylight.onrender.com/"
    },
    {
      name: "RishiAI",
      section: "tools",
      keys: ["A", "S", "K", "?"],
      description: "An AI assistant you can chat with, or ask to draft a proposal, email, outline or code that you then refine together. Sign in to use it.",
      url: "https://rishi-ai-xgv8.onrender.com/",
      action: "Open"
    },
    {
      name: "Heatwave 2048",
      section: "games",
      keys: ["2", "0", "4", "8"],
      description: "Slide matching tiles together to double them and reach 2048. The tiles glow hotter as the numbers climb. Use the arrow keys, WASD or swipe, and beat your best score on the leaderboard.",
      url: "https://heatwave-2048.onrender.com/"
    },
    {
      name: "Toolbench",
      section: "tools",
      keys: ["T", "O", "O", "L"],
      description: "A workbench of handy tools, all in one place. Open it up and pick the one you need.",
      url: "https://toolbench.onrender.com/",
      action: "Open"
    }
  ];

  const tabsEl = document.getElementById("tabs");
  const groupsEl = document.getElementById("groups");
  const byName = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });

  function makeCard(app) {
    const a = document.createElement("a");
    a.className = "app";
    a.href = app.url;
    a.target = "_blank";
    a.rel = "noopener";

    const keys = document.createElement("div");
    keys.className = "keys";
    keys.setAttribute("aria-hidden", "true");
    app.keys.forEach(k => {
      const s = document.createElement("span");
      s.textContent = k;
      keys.appendChild(s);
    });

    const h = document.createElement("h3");
    h.textContent = app.name;
    const p = document.createElement("p");
    p.textContent = app.description;
    const play = document.createElement("span");
    play.className = "play";
    play.textContent = app.action || "Play";

    a.append(keys, h, p, play);
    return a;
  }

  // Build one section per category, skipping any that have no apps yet.
  const groups = [];
  sections.forEach(sec => {
    const list = apps.filter(a => a.section === sec.id).sort(byName);
    if (!list.length) return;

    const group = document.createElement("section");
    group.className = "group";
    group.id = sec.id;
    group.setAttribute("aria-labelledby", sec.id + "-title");

    const head = document.createElement("div");
    head.className = "group-head";
    const h2 = document.createElement("h2");
    h2.id = sec.id + "-title";
    h2.textContent = sec.name;
    const blurb = document.createElement("p");
    blurb.textContent = sec.blurb;
    head.append(h2, blurb);

    const shelf = document.createElement("div");
    shelf.className = "shelf";
    list.forEach(app => shelf.appendChild(makeCard(app)));

    group.append(head, shelf);
    groupsEl.appendChild(group);
    groups.push({ id: sec.id, name: sec.name, count: list.length, el: group });
  });

  // Section buttons at the top: "All" plus one per section.
  const choices = [{ id: "all", name: "All", count: apps.length }, ...groups];
  const buttons = choices.map(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "tab";
    b.dataset.id = c.id;
    const label = document.createElement("span");
    label.textContent = c.name;
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = c.count;
    b.append(label, count);
    b.addEventListener("click", () => show(c.id, true));
    tabsEl.appendChild(b);
    return b;
  });

  function show(id, fromClick) {
    if (!choices.some(c => c.id === id)) id = "all";
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
    groups.forEach(g => { g.el.hidden = id !== "all" && g.id !== id; });
    if (fromClick) {
      try { history.replaceState(null, "", id === "all" ? location.pathname + location.search : "#" + id); } catch (e) {}
      const top = tabsEl.getBoundingClientRect().top + window.scrollY;
      if (window.scrollY > top) window.scrollTo({ top });
    }
  }

  show(location.hash.slice(1) || "all", false);
  window.addEventListener("hashchange", () => show(location.hash.slice(1) || "all", false));
</script>
</body>
</html>
